<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
    </header>

    <!-- Balance Display -->
    <section class="section-balance" aria-label="Total Balance">
      <h2>Total Balance</h2>
      <div id="balance-display">
        <span id="balance-value">$0.00</span>
      </div>
    </section>

    <!-- Input Form -->
    <section class="section-form" aria-label="Add Expense">
      <h2>Add Expense</h2>
      <form id="expense-form" novalidate>
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input
            type="text"
            id="item-name"
            name="item-name"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
          <span class="error" id="item-name-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            placeholder="e.g. 12.50"
          />
          <span class="error" id="amount-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="" disabled selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
            <option value="Custom">Custom</option>
          </select>
          <span class="error" id="category-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit">Add Expense</button>
      </form>
    </section>

    <!-- Error Banner -->
    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden>
      <span id="error-banner-message"></span>
      <button id="error-banner-close" aria-label="Dismiss error">✕</button>
    </div>

    <!-- Transaction List -->
    <section class="section-list" aria-label="Transaction List">
      <h2>Transactions</h2>
      <ul id="transaction-list" aria-label="Recorded transactions">
        <li class="no-transactions">No transactions recorded yet.</li>
      </ul>
    </section>

    <!-- Pie Chart -->
    <section class="section-chart" aria-label="Spending Distribution">
      <h2>Spending by Category</h2>
      <div class="chart-container">
        <canvas id="pie-chart" aria-label="Spending distribution pie chart" role="img"></canvas>
      </div>
    </section>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
